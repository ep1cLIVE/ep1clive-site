# Optional. Reads your live state from the Twitch API and commits it into
# status.json, which is the only file the website reads to decide on-air/off-air.
# Skip this entirely and just edit status.json by hand if you prefer.
name: channel status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-status
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          CHANNEL: ep1clive
        run: |
          set -euo pipefail
          if [ -z "${TWITCH_CLIENT_ID:-}" ] || [ -z "${TWITCH_CLIENT_SECRET:-}" ]; then
            echo "No Twitch credentials configured — leaving status.json untouched."
            echo "Add TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET under Settings > Secrets and variables > Actions."
            exit 0
          fi

          token=$(curl -fsS -X POST "https://id.twitch.tv/oauth2/token" \
            -d "client_id=$TWITCH_CLIENT_ID" \
            -d "client_secret=$TWITCH_CLIENT_SECRET" \
            -d "grant_type=client_credentials" | jq -r .access_token)

          curl -fsS -G "https://api.twitch.tv/helix/streams" \
            --data-urlencode "user_login=$CHANNEL" \
            -H "Client-Id: $TWITCH_CLIENT_ID" \
            -H "Authorization: Bearer $token" > stream.json

          jq --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            live: ((.data | length) > 0),
            title: (.data[0].title // ""),
            game: (.data[0].game_name // ""),
            viewers: (.data[0].viewer_count // 0),
            startedAt: (.data[0].started_at // ""),
            note: "",
            updatedAt: $now
          }' stream.json > status.json
          rm stream.json
          cat status.json

      - name: Commit when the state changed
        run: |
          set -euo pipefail
          if git diff --quiet -- status.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "channel-status[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "channel status: $(jq -r 'if .live then "on air" else "off air" end' status.json)"
          git push
